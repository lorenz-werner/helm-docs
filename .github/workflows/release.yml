name: Release (fork)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Fork release tag
        required: true
        default: v1.14.2-security.1

permissions:
  contents: read
concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || 'v1.14.2-security.1' }}
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  build:
    if: github.repository == 'lorenz-werner/helm-docs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Validate release tag and locked dependencies
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-security\.[0-9]+$ ]]
          go version
          go mod download
          go mod verify
          go test -mod=readonly ./...
          git diff --exit-code -- go.mod go.sum
      - name: Static analysis and chart regression tests
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -exclude G304 ./...
          bash scripts/check-example-charts-diff
      - name: Build and scan Linux AMD64 release
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release staging
          GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath \
            -ldflags "-X main.version=$version" \
            -o staging/helm-docs ./cmd/helm-docs
          staging/helm-docs --version
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          "$(go env GOPATH)/bin/govulncheck" -mode=binary staging/helm-docs
          go version -m staging/helm-docs > release/go-buildinfo.txt
          cp LICENSE README.md staging/
          tar -C staging -czf "release/helm-docs_${version}_Linux_x86_64.tar.gz" helm-docs LICENSE README.md
          (cd release && sha256sum *.tar.gz go-buildinfo.txt > checksums.txt)
          git diff --exit-code -- go.mod go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: fork-release-assets
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'lorenz-werner/helm-docs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fork-release-assets
          path: release
      - name: Publish verified assets to this fork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c checksums.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "helm-docs $RELEASE_TAG" \
            --notes "Unofficial security build from this fork. Uses the locked Go modules in the tagged source. Linux amd64 archive, SHA-256 checksums and Go build information. Unit tests, chart regression tests, Gosec and source/binary govulncheck must pass before publication. Upstream release channels are not used."
